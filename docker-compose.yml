services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"   # hanya bisa diakses dari mesin lokal
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: praktikum_kbd
      DB_USER: postgres
      DB_PASSWORD: postgres
    volumes:
      - ./app:/var/www/html   # edit kode langsung tanpa rebuild
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: praktikum_kbd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d praktikum_kbd"]
      interval: 3s
      timeout: 3s
      retries: 10
    # port 5432 sengaja tidak di-publish; hanya web yang bisa akses lewat network Docker

volumes:
  pgdata:
